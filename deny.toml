[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    # Sentry's rustls stack: aws-lc-rs, aws-lc-sys, rustls-webpki, untrusted
    # are ISC; webpki-root-certs is CDLA-Permissive-2.0. Both permissive;
    # accepted as project policy 2026-10-07 (Sentry audit round 2).
    "ISC",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "wasi"
version = "*"
expression = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
license-files = []
