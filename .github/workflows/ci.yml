name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --all-targets

  determinism:
    name: Deterministic replay acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # The milestone, proven for real: the binary runs as a subprocess,
      # twice in separate processes (byte-identical), kill -9 mid-replay
      # with resume, corruption rejection, golden vectors.
      - name: Replay acceptance suite
        run: cargo test -p onx --test phase5_replay

      - name: Cross-process determinism probes (phases 1/3/4)
        run: |
          cargo test -p onx-state-model --test phase1_canonical_encoding
          cargo test -p onx-stf --test phase3_stf cross_process
          cargo test -p onx-storage --test phase4_storage

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit
