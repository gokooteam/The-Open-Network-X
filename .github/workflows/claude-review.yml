name: Claude PR Audit

# Runs an automated Claude Code audit (Opus 5.5, medium effort) on every pull
# request: when it is opened, reopened, marked ready for review, and on each
# new push to it. Findings are posted as inline review comments, and the
# progress comment the action creates is the run's one summary comment.
#
# This is turn 1 of the review relay: when it succeeds, review-relay.yml
# starts turns 2 and 3 (see docs/guides/review-relay.md).
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (generate it with
# `claude setup-token`; add it under Settings -> Secrets and variables ->
# Actions).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Claude audit
    # Only run in gokooteam/The-Open-Network-X (not in the upstream
    # quickerup repo, which also carries this file via merges). Skip drafts,
    # and PRs from other forks (GitHub does not expose secrets to them).
    if: >-
      github.repository == 'gokooteam/The-Open-Network-X' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are auditing a pull request to The Open Network X, a Rust
            blockchain implementation (consensus, cryptography, networking,
            state, contracts). Read CONTRIBUTING.md and INSTRUCTIONS.md for the
            project's conventions, then read the full diff with `gh pr diff`
            and open the surrounding code in the checkout wherever the diff
            alone is not enough to judge a change.

            Audit for, in priority order:
            1. Correctness bugs: logic errors, off-by-one, integer
               overflow/underflow, unchecked arithmetic, panics/unwrap on
               untrusted input, error handling that drops failures.
            2. Security and consensus safety: anything that could fork the
               chain or break determinism (non-deterministic iteration,
               floating point, time/locale dependence), signature or hash
               misuse, missing validation of network or transaction input,
               DoS vectors (unbounded allocation, loops, or recursion),
               key-material handling, unsafe code.
            3. Breaking changes to serialization formats, genesis, chain IDs,
               RPC/API surfaces, or on-disk state without a migration.
            4. Missing or inadequate tests for the changed behavior.
            5. Concurrency issues: races, deadlocks, lock ordering.

            Rules:
            - Report only real, verified problems. For each one, trace a
              concrete input or state that triggers it. Do not post style
              nits that rustfmt or clippy already enforce.
            - Post each finding as an inline comment on the exact line with
              mcp__github_inline_comment__create_inline_comment, prefixed with
              its severity: [critical], [high], [medium], or [low].
            - Your progress comment is this run's summary. Finish by updating
              it. Start the summary with two lines:
              `Consensus impact: breaking | adjacent | none` and one sentence
              of reason (breaking: a node with and a node without this PR
              compute different state for the same blocks; adjacent: touches
              consensus code but results are unchanged), saying whether you
              agree with the impact the PR description declares; then
              `Determinism:` whether this could behave differently on two
              honest nodes given the same inputs. Then the findings by
              severity, or a plain statement that no issues were found and
              what you checked. End with one line, `Verdict: GO` or
              `Verdict: NO-GO`: NO-GO when any critical, high or medium
              finding stands. Do not post any other top-level comment.
          claude_args: |
            --model claude-opus-5-5
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
