[package]
name = "onx-genesis"
version.workspace = true
edition = "2021"
description = "Deterministic ONX genesis generator and bootstrap config exporter."
license = "Apache-2.0"
publish = false

[[bin]]
name = "onx-genesis"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
onx-state-model = { path = "../../protocol/onx-state-model" }
onx-data-structures = { path = "../../protocol/onx-data-structures" }
onx-primitives = { path = "../../protocol/onx-primitives" }
