[package]
name = "onx-cli"
version.workspace = true
edition = "2021"
description = "ONX command-line wallet: key generation and signed external-message construction."
license = "Apache-2.0"
publish = false

[[bin]]
name = "onx-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
bip39 = { version = "2", features = ["rand"] }
onx-primitives = { path = "../../protocol/onx-primitives" }
onx-data-structures = { path = "../../protocol/onx-data-structures" }
onx-stf = { path = "../../protocol/onx-stf" }
onx-genesis = { path = "../onx-genesis" }

[dev-dependencies]
onx-economics = { path = "../../protocol/onx-economics" }
