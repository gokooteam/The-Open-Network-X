[package]
name = "onx-cli"
version.workspace = true
edition = "2021"
description = "Deterministic ONX CLI wallet and contract command scaffold."
license = "Apache-2.0"
publish = false

[[bin]]
name = "onx-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tokio = { version = "1.38", features = ["full"] }
bip39 = { version = "2", features = ["rand"] }
onx-primitives = { path = "../../protocol/onx-primitives" }
