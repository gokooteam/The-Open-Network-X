[package]
name = "onxd"
version = "0.1.0"
edition = "2021"
description = "ONX node daemon bootstrap: config parsing, role selection, storage, consensus, execution, networking, and transaction routing summary."
license = "Apache-2.0"
publish = false

[[bin]]
name = "onxd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
hex = "0.4"
libc = "0.2"
onx-telemetry = { path = "../onx-telemetry" }
onx-state-model = { path = "../../protocol/onx-state-model" }
onx-execution = { path = "../../protocol/onx-execution" }
onx-consensus = { path = "../../protocol/onx-consensus" }
onx-networking = { path = "../onx-networking" }
onx-transactions = { path = "../../protocol/onx-transactions" }
onx-data-structures = { path = "../../protocol/onx-data-structures" }
onx-primitives = { path = "../../protocol/onx-primitives" }
onx-storage = { path = "../../protocol/onx-storage" }
onx-stf = { path = "../../protocol/onx-stf" }
onx-genesis = { path = "../../tooling/onx-genesis" }
# Reuses the canonical block-file format for the daemon's block output dir.
# Layering note: blockfile ideally lives in a protocol crate; until then the
# node reuses the tooling crate's implementation rather than duplicating the
# format (two encoders would drift).
onx = { path = "../../tooling/onx" }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
hex = "0.4"
libc = "0.2"
