[package]
name = "onx-storage"
version.workspace = true
edition = "2021"
description = "ONX atomic chain storage: redb-backed persistence for the deterministic-replay plan (Phase 4). One atomic transaction covers state, block body, seqno index, and head pointer."
license = "Apache-2.0"
publish = false

[dependencies]
onx-primitives = { path = "../onx-primitives" }
onx-data-structures = { path = "../onx-data-structures" }
onx-state-model = { path = "../onx-state-model" }
onx-stf = { path = "../onx-stf" }
redb = "2"

[[bin]]
name = "onx-crash-probe"
path = "src/bin/onx-crash-probe.rs"
