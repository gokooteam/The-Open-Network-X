[package]
name = "onx-stf"
version.workspace = true
edition = "2021"
description = "ONX pure state transition function: block bodies and deterministic Onyxi transfer/fee application per the deterministic-replay plan (Phase 3)"
license = "Apache-2.0"
publish = false

[dependencies]
onx-primitives = { path = "../onx-primitives" }
onx-data-structures = { path = "../onx-data-structures" }
onx-state-model = { path = "../onx-state-model" }
onx-economics = { path = "../onx-economics" }
onx-execution = { path = "../onx-execution" }

[[bin]]
name = "onx-stf-probe"
path = "src/bin/onx-stf-probe.rs"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"
